# Plantilla de la imagen Docker oficial de Nginx (envsubst al arrancar).
# Para usar fuera de Docker, sustituya PORT y BACKEND_UPSTREAM por sus valores.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # El publicador de Vite solo existe en desarrollo/preview.
    location /__iter-animi/ {
        return 404;
    }

    # API: conserva /api/v1 y Authorization; backend es el nombre DNS en Compose.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Recursos con hash: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Una imagen o un manifiesto ausente debe dar 404, nunca el HTML de la SPA.
    location /sprite-library/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /visual-packages/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Cualquier ruta interna de la SPA devuelve index.html (refrescar no da 404).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Ejemplo de servidor web para el build de producción (frontend/dist).
# Sirve la SPA y reenvía /api al backend en el mismo origen (sin CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: mismo origen. Ajuste la dirección del backend (uvicorn).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos con hash: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cualquier ruta interna de la SPA devuelve index.html (refrescar no da 404).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# DEMO gratuita: frontend estático + API. PostgreSQL externo en Neon.
# No incluye workers de expiración ni correo SMTP. Ver docs/DESPLIEGUE.md.
services:
  - type: web
    name: iter-animi-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free no permite preDeployCommand: las migraciones se ejecutan antes de la API.
    dockerCommand: python -m app.scripts.start_server
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CONVOCATION_CODE_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SIMULATOR_ACCESS_URL
        sync: false
      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"
      - key: NOTIFICATIONS_WORKER_INTERVAL_SECONDS
        value: "30"
  - type: web
    name: iter-animi-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
